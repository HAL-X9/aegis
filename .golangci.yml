# golangci-lint configuration (schema v2).
# Pinned in CI to golangci-lint v2.14.0 (verified against Go 1.27).
version: "2"

linters:
  # Standard set: errcheck, govet, ineffassign, staticcheck, unused.
  # govet here subsumes the standalone `go vet` step.
  default: standard
  enable:
    - depguard

  settings:
    # Layer rules: ARCHITECTURE.md ("Dependency rules") is the human-readable
    # version of this block. depguard checks direct imports of every file, tests
    # included, so a layer is kept honest transitively as long as each layer has
    # a rule. A package that matches no rule is unchecked: add a rule when
    # adding a top-level package under internal/.
    #
    # Two styles are used on purpose:
    #   - leaf layers use list-mode "strict" (an allow-list): anything not named,
    #     including a new third-party module, fails;
    #   - the other layers use "lax" (a deny-list of the layers they must not reach).
    #
    # Rules marked TODO(arch) record a known violation that is still allowed.
    # Each one names the refactoring step that removes it; removing the rule
    # (or the exempting file pattern) is part of that step.
    depguard:
      rules:
        # --- Leaf layers: allow-lists ---------------------------------------
        httpmethod:
          list-mode: strict
          files:
            - "**/internal/httpmethod/**"
          allow:
            - $gostd

        snapshot:
          # The compiled contract between the control plane and the data plane.
          # It may know about methods and nothing else.
          list-mode: strict
          files:
            - "**/internal/snapshot/**"
          allow:
            - $gostd
            - github.com/HAL-X9/aegis/internal/httpmethod

        config:
          # Data, defaults and validation of the process config.
          list-mode: strict
          files:
            - "**/internal/config/**"
          allow:
            - $gostd
            - github.com/HAL-X9/aegis/internal/yamlx

        yamlx:
          # Strict YAML decoding shared by config and the routes loader.
          list-mode: strict
          files:
            - "**/internal/yamlx/**"
          allow:
            - $gostd
            - gopkg.in/yaml.v3

        observe:
          list-mode: strict
          files:
            - "**/internal/observe/**"
          allow:
            - $gostd
            - github.com/prometheus/client_golang

        # --- Control plane: must not reach the serving side -----------------
        controlplane:
          list-mode: lax
          files:
            - "**/internal/controlplane/**"
          deny:
            - pkg: github.com/HAL-X9/aegis/internal/dataplane
              desc: the control plane compiles configuration; it must not depend on the data plane
            - pkg: github.com/HAL-X9/aegis/internal/edge
              desc: the control plane must not depend on the HTTP edge
            - pkg: github.com/HAL-X9/aegis/internal/observe
              desc: the control plane must not depend on observability
            - pkg: github.com/HAL-X9/aegis/internal/app
              desc: only cmd may depend on the composition root
            - pkg: github.com/HAL-X9/aegis/internal/config
              desc: the control plane reads the routes manifest, not the process config

        # --- Data plane: must not reach up or sideways ----------------------
        dataplane:
          list-mode: lax
          files:
            - "**/internal/dataplane/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/HAL-X9/aegis/internal/controlplane
              desc: the data plane reads the compiled snapshot; it must not depend on the control plane
            - pkg: github.com/HAL-X9/aegis/internal/edge
              desc: the data plane must not depend on the HTTP edge
            - pkg: github.com/HAL-X9/aegis/internal/config
              desc: the data plane receives what it needs through snapshot or constructor arguments
            - pkg: github.com/HAL-X9/aegis/internal/app
              desc: only cmd may depend on the composition root

        dataplane-tests:
          # TODO(arch) step 6: data plane tests build their snapshots with the
          # real compiler (controlplane/compile). Give snapshot a small test
          # builder, then fold this rule into "dataplane" above.
          list-mode: lax
          files:
            - "**/internal/dataplane/**/*_test.go"
          deny:
            - pkg: github.com/HAL-X9/aegis/internal/controlplane/loader
              desc: data plane tests may use the compiler, not the rest of the control plane
            - pkg: github.com/HAL-X9/aegis/internal/controlplane/validate
              desc: data plane tests may use the compiler, not the rest of the control plane
            - pkg: github.com/HAL-X9/aegis/internal/controlplane/normalize
              desc: data plane tests may use the compiler, not the rest of the control plane
            - pkg: github.com/HAL-X9/aegis/internal/controlplane/schema
              desc: data plane tests may use the compiler, not the rest of the control plane
            - pkg: github.com/HAL-X9/aegis/internal/controlplane/ir
              desc: data plane tests may use the compiler, not the rest of the control plane
            - pkg: github.com/HAL-X9/aegis/internal/controlplane/pipeline
              desc: data plane tests may use the compiler, not the rest of the control plane
            - pkg: github.com/HAL-X9/aegis/internal/edge
              desc: the data plane must not depend on the HTTP edge
            - pkg: github.com/HAL-X9/aegis/internal/config
              desc: the data plane receives what it needs through snapshot or constructor arguments
            - pkg: github.com/HAL-X9/aegis/internal/app
              desc: only cmd may depend on the composition root

        dataplane-observe:
          # TODO(arch) step 4: dataplane/middleware imports observe/metrics. It
          # is HTTP plumbing, not routing or proxying, and moves to the edge;
          # then delete the middleware exemption so the whole data plane is covered.
          list-mode: lax
          files:
            - "**/internal/dataplane/**"
            - "!**/internal/dataplane/middleware/**"
          deny:
            - pkg: github.com/HAL-X9/aegis/internal/observe
              desc: the data plane stays free of observability backends

        # --- Edge: allow-list ------------------------------------------------
        edge:
          # The edge reaches the data plane only through interfaces it declares
          # (RequestExecutor, Probe), plus the two temporary imports below.
          list-mode: strict
          files:
            - "**/internal/edge/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/HAL-X9/aegis/internal/observe
            # The edge's own subpackages, such as edge/tlsconfig.
            - github.com/HAL-X9/aegis/internal/edge
            # TODO(arch) step 4: the middleware package moves under edge.
            - github.com/HAL-X9/aegis/internal/dataplane/middleware

        edge-tests:
          # Same as "edge", plus prometheus: a test builds its own registry.
          # Production edge code still reaches Prometheus only through observe.
          list-mode: strict
          files:
            - "**/internal/edge/**/*_test.go"
          allow:
            - $gostd
            - github.com/HAL-X9/aegis/internal/observe
            - github.com/HAL-X9/aegis/internal/edge
            - github.com/HAL-X9/aegis/internal/dataplane/middleware
            - github.com/prometheus/client_golang

        # --- Direction inside the layers --------------------------------------
        # The control plane is a pipeline, schema -> validate -> normalize ->
        # compile, driven by loader and pipeline; in the data plane, proxy sits
        # on top of small packages that know nothing about one another. These
        # allow-lists keep each package to the neighbours it may know. They
        # cover production code: tests may import their neighbours.
        leaf-packages:
          list-mode: strict
          files:
            - "**/internal/controlplane/schema/**"
            - "**/internal/controlplane/ir/**"
            - "**/internal/dataplane/request/**"
            - "**/internal/dataplane/routelabel/**"
            - "**/internal/dataplane/fault/**"
            - "!**/*_test.go"
          allow:
            - $gostd

        controlplane-validate:
          list-mode: strict
          files:
            - "**/internal/controlplane/validate/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/HAL-X9/aegis/internal/controlplane/schema
            - github.com/HAL-X9/aegis/internal/httpmethod
            - golang.org/x/net/http/httpguts

        controlplane-normalize:
          list-mode: strict
          files:
            - "**/internal/controlplane/normalize/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/HAL-X9/aegis/internal/controlplane/schema
            - github.com/HAL-X9/aegis/internal/controlplane/ir

        controlplane-compile:
          list-mode: strict
          files:
            - "**/internal/controlplane/compile/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/HAL-X9/aegis/internal/controlplane/ir
            - github.com/HAL-X9/aegis/internal/snapshot
            - github.com/HAL-X9/aegis/internal/httpmethod

        controlplane-loader:
          list-mode: strict
          files:
            - "**/internal/controlplane/loader/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/HAL-X9/aegis/internal/controlplane/schema
            - github.com/HAL-X9/aegis/internal/controlplane/validate
            - github.com/HAL-X9/aegis/internal/yamlx

        controlplane-pipeline:
          list-mode: strict
          files:
            - "**/internal/controlplane/pipeline/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/HAL-X9/aegis/internal/controlplane/validate
            - github.com/HAL-X9/aegis/internal/controlplane/normalize
            - github.com/HAL-X9/aegis/internal/controlplane/compile
            - github.com/HAL-X9/aegis/internal/snapshot

        dataplane-policy:
          list-mode: strict
          files:
            - "**/internal/dataplane/policy/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/HAL-X9/aegis/internal/snapshot
            - golang.org/x/time/rate

        dataplane-retry:
          list-mode: strict
          files:
            - "**/internal/dataplane/retry/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/HAL-X9/aegis/internal/snapshot

        dataplane-router:
          list-mode: strict
          files:
            - "**/internal/dataplane/router/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/HAL-X9/aegis/internal/snapshot
            - github.com/HAL-X9/aegis/internal/httpmethod

        # --- Composition root -------------------------------------------------
        no-app:
          # internal/app wires everything, so nothing inside internal/ may
          # depend on it. Binaries and tests outside internal/ are free to.
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/internal/app/**"
          deny:
            - pkg: github.com/HAL-X9/aegis/internal/app
              desc: only cmd and tests may depend on the composition root

formatters:
  enable:
    - gofmt
