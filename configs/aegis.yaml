version: aegisconfig/v1

http:
  addr: ":8080"
  tls: null
  timeouts:
    read_timeout: 10s
    read_header_timeout: 5s
    write_timeout: 30s
    idle_timeout: 120s
  max_header_bytes: 1048576

upstream_transport:
  max_idle_conns: 1024
  max_idle_conns_per_host: 128
  max_conns_per_host: 0
  dial_timeout: 3s
  tls_handshake_timeout: 5s
  response_header_timeout: 10s
  idle_conn_timeout: 90s

observability:
  logging:
    level: info
    format: json
  tracing:
    enabled: false
    endpoint: "http://localhost:4318"
