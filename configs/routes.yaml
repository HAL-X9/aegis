# version: routeconfig/v1
# kind: RouteConfig

routes:
  - name: model-health
    match:
      path_prefix: /model/v1/healthz
      methods: [GET]
    upstream:
      scheme: http
      host: localhost
      port: 8081

  - name: orders-model
    match:
      path_prefix: /model/v1/orders
      methods: [GET, POST]
    upstream:
      scheme: http
      host: orders.internal
      port: 8082
